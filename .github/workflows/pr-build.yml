name: "PR: Verify build"

on:
  pull_request:
    branches:
      - main
      - 'release/v*'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run ts-check

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint:dry

      - name: Format check
        run: npm run prettier:dry

      - name: Build
        run: npm run build
